<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1420" />
    <meta name="description" content="Flappy Blunt. One flap. Chill heist energy." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flappy Blunt" />
    <title>Flappy Blunt</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="preload" href="assets/LilitaOne-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
    <link rel="preload" href="assets/Anton-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="splash">
      <img src="assets/splash.png" alt="Flappy Blunt. One flap. Chill heist energy." />
    </div>
    <h1 class="sr-only">Flappy Blunt</h1>
    <p class="sr-only">One-button flyer. Press the gold PLAY button, or press space or arrow up, to start. In the air, tap or press space to flap. After a crash, press the gold RESTART button to fly again.</p>
    <canvas id="game" width="420" height="750" aria-label="Flappy Blunt. Press PLAY, or press space, to start. Tap to flap."></canvas>
    <script src="js/feel.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/meta.js"></script>
    <script src="js/render.js"></script>
    <script src="js/game.js"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      }
    </script>
  </body>
</html>
